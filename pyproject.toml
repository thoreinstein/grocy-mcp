[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grocy-mcp"
version = "0.1.0"
description = "An MCP server for Grocy: read and manage a household pantry from an AI agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "grocy", "pantry", "inventory", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    # Upper bound is load-bearing, not caution: mcp 2.x renamed FastMCP to
    # MCPServer, so an unbounded requirement means a fresh install resolves to
    # 2.x and the server fails to import before it serves anything. Migrating
    # to the 2.x API is the real fix; until then this keeps installs working.
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
# Only needed to verify OAuth bearer tokens, i.e. when serving over HTTP with
# --auth. A stdio server needs neither.
http = [
    "pyjwt>=2.8",
    "cryptography>=42",
]
dev = [
    "pytest>=8",
]

[project.scripts]
grocy-mcp = "grocy_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/anishanilkumar/grocy-mcp"
Issues = "https://github.com/anishanilkumar/grocy-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["grocy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
